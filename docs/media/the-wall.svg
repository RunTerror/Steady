</g></g>
<rect x="276" y="252" width="288" height="186" rx="22" class="phone"/>
<text x="256" y="120" class="note" text-anchor="end">the curtain</text>
<text x="256" y="140" class="sub" text-anchor="end">hides empty wall</text>
<path d="M262 126 h20" class="lead"/>
<text x="256" y="340" class="note" text-anchor="end">your screen</text>
<text x="256" y="360" class="sub" text-anchor="end">never moves</text>
<path d="M262 346 h10" class="lead"/>
<g class="newlabel">
<text x="584" y="186" class="note" text-anchor="start">older messages,</text>
<text x="584" y="206" class="sub" text-anchor="start">pinned onto bare wall</text>
<path d="M578 192 h-20" class="lead"/>
</g>
<text x="584" y="410" class="note" text-anchor="start">1,000,000 pt tall.</text>
<text x="584" y="430" class="sub" text-anchor="start">Over a thousand iPhone screens.</text>
<text x="584" y="450" class="sub" text-anchor="start">It never grows.</text>
</svg>
