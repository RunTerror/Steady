<path class="cup" d="M66 58 h88 v30 a44 30 0 0 1 -88 0 z"/>
<path class="cup" d="M154 66 a16 16 0 0 1 0 32" fill="none"/>
<ellipse class="coffee" cx="110" cy="60" rx="40" ry="5"/>
<polygon class="star" points="260,30 271,56 299,58 277,76 284,103 260,88 236,103 243,76 221,58 249,56"/>
<circle class="spark" cx="314" cy="36" r="4"/>
<circle class="spark p2" cx="212" cy="40" r="3"/>
<circle class="spark p3" cx="308" cy="104" r="3.5"/>
</svg>
