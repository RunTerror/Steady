<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-label="Animation of the trick. A red curtain covers the empty wall above the chat. It lifts, three older messages are pinned onto the bare wall, and the phone screen below never moves."><style>
  .bg { fill: #f6f8fa; }
  .wall { fill: #efe7dc; }
  .brick { stroke: #e2d6c5; stroke-width: 1; }
  .msg { fill: #d3d3d8; }
  .read { fill: #0a84ff; }
  .new { fill: #c8f0d2; stroke: #1f8f3a; stroke-width: 1.5; }
  .tack { font-size: 15px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .cloth { fill: #c2413a; }
  .fold { fill: #a8352f; }
  .phone { fill: none; stroke: #1c1c1e; stroke-width: 3; }
  .lead { stroke: #8e8e93; stroke-width: 1.5; fill: none; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c1c1e; }
  .note { font-size: 16px; font-weight: 600; }
  .sub { font-size: 14px; fill: #6e6e73; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161b22; }
    .wall { fill: #3a332b; }
    .brick { stroke: #4a4137; }
    .msg { fill: #5a5a5e; }
    .new { fill: #1f4d2c; stroke: #32d74b; }
    .phone { stroke: #f2f2f7; }
    text { fill: #f2f2f7; }
    .sub { fill: #a1a1a6; }
  }

  /* 6 s loop: the curtain lifts, three messages get pinned, hold, reset. */
  .curtain, .pin, .newlabel { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .curtain { animation-name: lift; }
  .pin { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .pin0 { animation-name: pin0; }
  .pin1 { animation-name: pin1; }
  .pin2 { animation-name: pin2; }
  .newlabel { animation-name: showlabel; }
  @keyframes lift {
    0%, 14% { transform: translateY(0); }
    30%, 88% { transform: translateY(-112px); }
    97%, 100% { transform: translateY(0); }
  }
  @keyframes pin0 { 0%, 26% { opacity: 0; transform: scale(.5); } 31% { opacity: 1; transform: scale(1.12); } 34%, 86% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(1); } }
  @keyframes pin1 { 0%, 32% { opacity: 0; transform: scale(.5); } 37% { opacity: 1; transform: scale(1.12); } 40%, 86% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(1); } }
  @keyframes pin2 { 0%, 38% { opacity: 0; transform: scale(.5); } 43% { opacity: 1; transform: scale(1.12); } 46%, 86% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(1); } }
  @keyframes showlabel { 0%, 42% { opacity: 0; } 50%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .curtain { animation: none; transform: translateY(-112px); }
    .pin, .newlabel { animation: none; opacity: 1; }
  }
</style>
<rect width="840" height="470" rx="16" class="bg"/>
